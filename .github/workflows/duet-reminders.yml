name: Duet notifications scheduler

on:
  push:
    branches: [main]
    paths: ['.github/workflows/duet-reminders.yml']
  schedule:
    # Approximately every 20 minutes, 24 hours a day. GitHub may delay
    # or skip scheduled runs; server-side slot IDs prevent duplicate pushes.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

# Request a short-lived signed identity; NO static repo secret is necessary.
permissions:
  id-token: write

concurrency:
  group: duet-notifications-scheduler
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate GitHub to Render and deliver Duet notifications
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC unavailable. Check permissions: id-token: write."
            exit 1
          fi
          # GitHub issues a short-lived OIDC JWT for exactly this audience.
          token=$(curl --proto '=https' --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=duet-render-cron" | jq -er '.value')
          if [[ -z "$token" ]]; then
            echo "::error::Unable to obtain the scheduler identity token."
            exit 1
          fi
          endpoint='https://danlet.onrender.com'
          # A new workflow version verifies OIDC immediately on merge, but
          # does not send surprise notifications simply because code changed.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            routes=(status)
          else
            routes=(status partner-notifications inspire)
          fi
          for route in "${routes[@]}"; do
            echo "Calling Duet ${route}"
            result="${RUNNER_TEMP}/duet-${route}.json"
            code=$(curl --proto '=https' --silent --show-error \
              --connect-timeout 15 --max-time 95 --retry 1 --retry-delay 5 \
              -X POST -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              -o "$result" -w '%{http_code}' \
              "${endpoint}/api/public/jobs/${route}")
            if [[ "$code" != "200" ]]; then
              echo "::error::Duet ${route} failed (HTTP ${code}). Check Render logs and service credentials."
              exit 1
            fi
            if [[ "$route" == status ]]; then
              supabase=$(jq -r '.supabaseAdminConfigured // false' "$result")
              firebase=$(jq -r '.firebaseConfigured // false' "$result")
              devices=$(jq -r '.registeredDevices // "unknown"' "$result")
              db_reachable=$(jq -r '.supabaseReachable // false' "$result")
              firebase_auth=$(jq -r '.firebaseAuthenticated // false' "$result")
              echo "Duet infrastructure: Supabase admin=${supabase}; database reachable=${db_reachable}; Firebase configured=${firebase}; Firebase OAuth=${firebase_auth}; enrolled devices=${devices}"
              if [[ "$supabase" != "true" || "$firebase" != "true" || "$db_reachable" != "true" || "$firebase_auth" != "true" ]]; then
                echo "::error::Push is not configured on Render. Provide server-side Supabase admin and Firebase service credentials."
                exit 1
              fi
              if [[ "$devices" == "0" ]]; then
                echo "::warning::No enrolled PWA devices. Install Duet and allow push on each iPhone."
              fi
            elif [[ "$route" == "partner-notifications" ]]; then
              accepted=$(jq -r '.sent // 0' "$result")
              echo "FCM accepted partner notifications: ${accepted}"
              echo "Partner push accepted by FCM: ${accepted}" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$route" == "inspire" ]]; then
              accepted=$(jq -r '.sent // 0' "$result")
              slot=$(jq -r '.slot // .reason // "unknown"' "$result")
              echo "FCM accepted Duet reminders: ${accepted}; slot or reason: ${slot}"
              echo "Reminder push accepted by FCM: ${accepted}; slot/reason: ${slot}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Duet notification jobs completed with authenticated requests." >> "$GITHUB_STEP_SUMMARY"
