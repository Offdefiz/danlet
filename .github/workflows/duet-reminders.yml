name: Duet notifications scheduler

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: duet-notifications-scheduler
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deliver queued events and daytime reminders
        env:
          DUET_CRON_SECRET: ${{ secrets.DUET_CRON_SECRET }}
          DUET_CRON_ENDPOINT: ${{ vars.DUET_CRON_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${DUET_CRON_SECRET}" ]; then
            echo "::warning::Pending setup: DUET_CRON_SECRET is not configured; notifications were not requested."
            printf '%s\n' 'Pending setup: add the DUET_CRON_SECRET repository secret with the same value configured on Render. No notifications were requested.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          endpoint="${DUET_CRON_ENDPOINT:-https://danlet.onrender.com}"
          for route in partner-notifications inspire; do
            echo "Requesting ${route} (response omitted to avoid exposing private data)"
            curl --proto '=https' --fail --silent --show-error --retry 1 --retry-delay 4 \
              --connect-timeout 15 --max-time 90 \
              -X POST -H "Authorization: Bearer ${DUET_CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -o /dev/null "${endpoint%/}/api/public/jobs/${route}"
          done
