name: Duet notifications scheduler

on:
  schedule:
    # Every 20 minutes, 09:07-21:47 America/Sao_Paulo (UTC-3).
    # GitHub may delay scheduled jobs; the server verifies local quiet hours.
    - cron: '7,27,47 0,12-23 * * *'
  workflow_dispatch:

# Request a short-lived signed identity; NO static repo secret is necessary.
permissions:
  id-token: write

concurrency:
  group: duet-notifications-scheduler
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate GitHub to Render and deliver Duet notifications
        env:
          ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC unavailable. Check permissions: id-token: write."
            exit 1
          fi
          # GitHub issues a short-lived OIDC JWT for exactly this audience.
          token=$(curl --proto '=https' --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=duet-render-cron" | jq -er '.value')
          if [[ -z "$token" ]]; then
            echo "::error::Unable to obtain the scheduler identity token."
            exit 1
          fi
          endpoint='https://danlet.onrender.com'
          for route in status partner-notifications inspire; do
            echo "Calling Duet ${route}"
            result="${RUNNER_TEMP}/duet-${route}.json"
            code=$(curl --proto '=https' --silent --show-error \
              --connect-timeout 15 --max-time 95 --retry 1 --retry-delay 5 \
              -X POST -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              -o "$result" -w '%{http_code}' \
              "${endpoint}/api/public/jobs/${route}")
            if [[ "$code" != "200" ]]; then
              echo "::error::Duet ${route} failed (HTTP ${code}). Check Render logs and service credentials."
              exit 1
            fi
            if [[ "$route" == status ]]; then
              supabase=$(jq -r '.supabaseAdminConfigured // false' "$result")
              firebase=$(jq -r '.firebaseConfigured // false' "$result")
              devices=$(jq -r '.registeredDevices // "unknown"' "$result")
              echo "Duet infrastructure: Supabase admin=${supabase}; Firebase sender=${firebase}; devices=${devices}"
              if [[ "$supabase" != "true" || "$firebase" != "true" ]]; then
                echo "::error::Push is not configured on Render. Provide server-side Supabase admin and Firebase service credentials."
                exit 1
              fi
              if [[ "$devices" == "0" ]]; then
                echo "::warning::No enrolled PWA devices. Install Duet and allow push on each iPhone."
              fi
            fi
          done
          echo "Duet notification jobs completed with authenticated requests." >> "$GITHUB_STEP_SUMMARY"
