name: Duet validation

on:
  push:
    branches:
      - main
      - fix/local-personal-themes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Require changelog entry for product changes
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_BRANCH" --depth=1
          changed=$(git diff --name-only "origin/$BASE_BRANCH" HEAD)
          if echo "$changed" | grep -Eq '^(src/|public/)'; then
            if ! echo "$changed" | grep -qx 'src/lib/release-notes.ts'; then
              echo 'Every visible product change requires a note in src/lib/release-notes.ts'
              exit 1
            fi
            previous=$(git show "origin/$BASE_BRANCH:src/lib/release-notes.ts" | sed -nE "s/^[[:space:]]*version: '([0-9]+\\.[0-9]+\\.[0-9]+)'.*/\\1/p" | head -n 1)
            current=$(sed -nE "s/^[[:space:]]*version: '([0-9]+\\.[0-9]+\\.[0-9]+)'.*/\\1/p" src/lib/release-notes.ts | head -n 1)
            if [[ -z "$previous" || -z "$current" || "$previous" == "$current" ]]; then
              echo 'Each product release must bump the version in release-notes.ts, not only edit the changelog.'
              exit 1
            fi
            if [[ "$(printf '%s\n' "$previous" "$current" | sort -V | tail -n 1)" != "$current" ]]; then
              echo "Release version $current must be newer than $previous."
              exit 1
            fi
          fi
      - name: Run automated tests
        run: bun run test
      - name: Probe keyless Firecrawl search (diagnostic only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/dream-dynamic-keyless-search-20261024'
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch('https://api.firecrawl.dev/v2/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: 'site:instagram.com casamento eventos Tiradentes MG',
              sources: [{ type: 'web' }, { type: 'images' }],
              limit: 5,
            }),
            signal: AbortSignal.timeout(15000),
          });
          const data = await r.json();
          console.log(JSON.stringify({
            keylessStatus: r.status,
            success: data.success,
            webResults: data.data?.web?.length ?? 0,
            imageResults: data.data?.images?.length ?? 0,
            error: data.error?.code ?? (typeof data.error === 'string' ? data.error.slice(0, 120) : null),
          }));
          NODE
      - name: Static analysis
        run: "bunx eslint . --rule 'prettier/prettier: off'"
      - name: Type check
        run: bunx tsc --noEmit
      - name: Compile app
        run: bun run build
