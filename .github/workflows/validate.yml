name: Duet validation

on:
  push:
    branches:
      - main
      - fix/local-personal-themes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run automated tests
        run: bun run test
      - name: Static analysis
        run: "bunx eslint . --rule 'prettier/prettier: off'"
      - name: Type check
        run: bunx tsc --noEmit
      - name: Compile app
        run: bun run build
